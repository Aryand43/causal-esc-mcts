# AFlow baseline + shared MCTS training hyperparameters (flat key: value)
# Smoke-test defaults below (maxsteps, num_simulations). Raise for paper-scale runs; see config/README.md.
learningrate: 1e-4
batchsize: 4
maxsteps: 10
flowlossweight: 1.0
